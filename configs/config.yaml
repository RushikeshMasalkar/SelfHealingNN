dataset:
  name: cifar100
  root: ./data/raw/
  download: auto
  image_size: 32
  num_classes: 100
  mean: [0.5071, 0.4865, 0.4409]
  std: [0.2673, 0.2564, 0.2761]
  train_split: 0.9

noise:
  types: [gaussian, salt_pepper, occlusion]
  gaussian_std: 0.05
  salt_pepper_prob: 0.01
  occlusion_size: 4

# Extra Gaussian std values for stress-test evaluation only (see evaluate.evaluation.gaussian_stress_levels)
evaluation:
  gaussian_stress_levels: [0.1, 0.2, 0.3, 0.5, 0.7]

vae:
  latent_dim: 256
  encoder_channels: [64, 128, 256]
  beta: 0.1
  beta_warmup_epochs: 10
  beta_start_factor: 0.0
  learning_rate: 0.001
  epochs: 100
  batch_size: 64
  patience: 20
  min_epochs_before_early_stop: 25
  min_improvement: 1.0e-5
  augment_train: false
  noise_types: [gaussian, salt_pepper]
  gaussian_std: 0.04
  salt_pepper_prob: 0.008
  occlusion_size: 4

classifier:
  backbone: resnet18
  pretrained: true
  learning_rate: 0.0002
  head_learning_rate: 0.002
  clean_input_mix_prob: 0.75
  phase1_epochs: 15
  phase2_epochs: 90
  batch_size: 64
  patience: 20
  min_epochs_before_early_stop: 25
  target_train_acc: 0.8
  dropout: 0.1

training:
  device: cuda
  num_workers: 4
  pin_memory: auto
  save_every: 5
  seed: 42
