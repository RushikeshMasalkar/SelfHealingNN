dataset:
  name: cifar100
  root: ./data/raw/
  image_size: 32
  num_classes: 100
  mean: [0.5071, 0.4867, 0.4408]
  std: [0.2675, 0.2565, 0.2761]
  train_split: 0.9

noise:
  types: [gaussian, salt_pepper, occlusion]
  gaussian_std: 0.3
  salt_pepper_prob: 0.05
  occlusion_size: 8

vae:
  latent_dim: 256
  encoder_channels: [32, 64, 128, 256]
  beta: 0.5
  learning_rate: 0.001
  epochs: 100
  batch_size: 64
  patience: 10

classifier:
  backbone: resnet18
  pretrained: true
  learning_rate: 0.0005
  epochs: 50
  batch_size: 64
  patience: 7
  dropout: 0.3

training:
  device: cuda
  num_workers: 4
  pin_memory: auto
  save_every: 5
  seed: 42
